<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn Python - Code Academy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            color: #172033;
        }

        /* Navbar */
        nav {
            height: 65px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #eee;
        }

        .logo {
            color: #1677ff;
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-size: 14px;
        }

        /* Hero */
        .hero {
            min-height: 450px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 90px;
            background: linear-gradient(135deg, #ffffff, #eef7ff);
        }

        .content {
            max-width: 600px;
        }

        .tag {
            display: inline-block;
            background: #e3efff;
            color: #1468e8;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 25px;
            color: #344866;
            margin-bottom: 20px;
        }

        .description {
            color: #52637a;
            line-height: 1.6;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 15px;
        }

        .start-btn {
            background: #1677ff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            background: white;
            color: #333;
            border: 1px solid #b9c7d8;
            padding: 14px 25px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #075fd8;
        }

        /* Python image */
        .python-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }

        /* Mobile */
        @media (max-width: 800px) {
            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 12px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
                padding: 50px 25px;
            }

            .buttons {
                justify-content: center;
            }

            h1 {
                font-size: 40px;
            }

            .python-image {
                width: 220px;
                height: 220px;
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">Code Academy</div>

        <div class="nav-links">
            <a href="/course">Home</a>
            <a href="/course">Courses</a>
            <a href="/course">About</a>
        </div>
    </nav>


    <!-- Course Hero -->
    <section class="hero">

        <div class="content">

            <span class="tag">
                Python Course
            </span>

            <h1>
                Learn Python
            </h1>

            <p class="subtitle">
                From beginner to advanced.
            </p>

            <p class="description">
                Master Python with hands-on projects, real-world
                examples and practical learning. Build your skills
                and create something amazing!
            </p>

            <div class="buttons">

                <button class="start-btn"
                        onclick="startLearning()">
                    Start Learning
                </button>

                <button class="back-btn"
                        onclick="goBack()">
                    Back to Home
                </button>

            </div>

        </div>


        <!-- Python image -->
        <img
            class="python-image"
            src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg"
            alt="Python Logo"
        >

    </section>


    <script>

        function startLearning() {
            alert("Welcome to Python Course!");
        }

        function goBack() {
            window.history.back();
        }

    </script>

</body>
</html>
